<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Color Jumper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu">
  <h1>Color Jumper Ultimate</h1>
  <button id="playBtn">Play</button>
  <button id="highBtn">High Scores</button>
  <div id="instructions">
    <h3>Instructions:</h3>
    <p>Move: ← / → or swipe, Jump: Space or tap</p>
    <p>Avoid red hazards, collect gold power-ups!</p>
  </div>
</div>

<div id="scoreBoard">
  <div id="score">Score: 0</div>
  <div id="level">Level: 1</div>
  <button id="pauseBtn">Pause</button>
</div>

<canvas id="game"></canvas>

<div id="highScores" style="display:none">
  <h2>High Scores</h2>
  <ul id="highList"></ul>
  <button onclick="closeHighScores()">Close</button>
</div>

<script src="main.js"></script>
</body>
</html>
